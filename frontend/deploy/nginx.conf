# O HTTPS FICA NO CADDY DO EDGE DA VPS. AQUI CHEGA HTTP PELA REDE `proxy`
# E O PROTOCOLO ORIGINAL VEM NO X-Forwarded-Proto
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # MESMA ORIGEM DA SPA: O COOKIE DE SESSÃO VAI SOZINHO
    # `yourtab-api`, NÃO `api`: NA REDE `proxy` DO EDGE, `api` É OUTRO SITE
    location /api/ {
        proxy_pass http://yourtab-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ARQUIVOS DO VITE TÊM HASH NO NOME: CACHE LONGO
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
