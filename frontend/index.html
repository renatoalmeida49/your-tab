<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta
      name="description"
      content="Site para construir suas cifras completas com versos e tablaturas. Todas podem ser impressas em PDF."
    />
    <meta name="keywords" content="Cifra, Tablatura, Tab">
    <link rel="icon" href="/favicon.ico">
    <title>Tab Builder | Construa cifras completas</title>
    <script>
      // APLICA O TEMA SALVO ANTES DO PRIMEIRO PAINT (SEM PISCAR CLARO)
      try {
        var theme = localStorage.getItem("theme");
        if (theme == "light" || theme == "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but Tab Builder doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
